name: inspect-tmp
on:
  push:
    branches: [claude/project-thread-mmp59e]
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Wait for the PR image with the new branding
        run: |
          for i in $(seq 1 45); do
            docker pull -q ghcr.io/thelinuxitguy/silverlit:pr-3-45 >/dev/null 2>&1 || true
            if docker run --rm --entrypoint /bin/bash ghcr.io/thelinuxitguy/silverlit:pr-3-45 -c 'test -f /usr/share/silverlit/fastfetch-logo.txt'; then
              echo "new image found"; exit 0
            fi
            sleep 60
          done
          exit 1
      - name: Verify branding in the built image
        run: |
          docker run --rm -e TERM=xterm-256color --entrypoint /bin/bash ghcr.io/thelinuxitguy/silverlit:pr-3-45 -c '
            echo "===== os-release"; cat /etc/os-release
            echo "===== image-info"; cat /usr/share/ublue-os/image-info.json
            echo "===== kcm-about-distrorc"; cat /etc/xdg/kcm-about-distrorc; ls -la /usr/share/pixmaps/silverlit-logo.png
            echo "===== ublue-image-info.sh"; cat /usr/bin/ublue-image-info.sh; /usr/bin/ublue-image-info.sh
            echo "===== ublue-fastfetch"; cat /usr/bin/ublue-fastfetch
            echo "===== fastfetch"; fastfetch --pipe false --config /usr/share/ublue-os/fastfetch.jsonc 2>&1 | head -40
            echo "===== motd"; HOME=/tmp ublue-motd 2>&1 | head -40
            echo "===== starship config check"; STARSHIP_CONFIG=/usr/share/silverlit/starship.toml starship prompt 2>&1 | head -5
            echo "===== remaining Aurora mentions in our branded files"; grep -n -i aurora /etc/os-release /usr/share/ublue-os/image-info.json /etc/xdg/kcm-about-distrorc /usr/share/ublue-os/motd/template.md /usr/share/ublue-os/motd/tips/*.md /usr/share/ublue-os/fastfetch.jsonc || echo none
          '
