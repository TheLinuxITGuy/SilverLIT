name: inspect-tmp
on:
  push:
    branches: [claude/project-thread-mmp59e]
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dump branding files from the published image
        run: |
          docker run --rm --entrypoint /bin/bash ghcr.io/thelinuxitguy/silverlit:latest -c '
            show() { for f in "$@"; do echo "===== $f"; if [ -f "$f" ] && grep -Iq . "$f"; then cat "$f"; else ls -la "$f"; fi; done; }
            show /usr/lib/os-release /usr/share/ublue-os/image-info.json /etc/xdg/kcm-about-distrorc /usr/share/kcm-about-distrorc
            echo "===== etc/xdg"; ls /etc/xdg
            echo "===== fastfetch files"; find /usr/share /etc -path "*fastfetch*" -type f 2>/dev/null | head -40
            for f in $(find /usr/share/ublue-os /etc -path "*fastfetch*" -type f 2>/dev/null | head -8); do show "$f"; done
            show /etc/profile.d/ublue-motd.sh /usr/bin/ublue-motd /usr/share/ublue-os/aurora-ascii-logo.txt
            echo "===== who references fastfetch config / ascii logo / distributor-logo"
            grep -rIl -E "aurora-ascii-logo|fastfetch.jsonc|distributor-logo|getaurora" /etc /usr/share/ublue-os /usr/bin /usr/libexec /usr/share/plasma /usr/share/kservices6 /usr/share/applications 2>/dev/null | head -60
            echo "===== aurora named files"; find / -xdev -iname "*aurora*" -not -path "/proc/*" -not -path "/usr/share/icons/*" -not -path "/usr/share/wallpapers/*" -not -path "/usr/share/backgrounds/*" 2>/dev/null | head -80
            echo "===== plymouth"; ls /usr/share/plymouth/themes 2>/dev/null; cat /etc/plymouth/plymouthd.conf 2>/dev/null
            echo "===== sddm"; ls /usr/share/sddm/themes 2>/dev/null; cat /etc/sddm.conf.d/* 2>/dev/null | head -30
            echo "===== kdeglobals"; cat /etc/xdg/kdeglobals 2>/dev/null | head -40
          '
